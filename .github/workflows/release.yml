name: Release

# Builds the addon for each platform of libgs into the package of the platform,
# in npm/<platform>, and publishes these packages and ghostscript4js to npm,
# which installs the package of the platform as an optional dependency. Run the
# workflow manually to build and test the addons, and pack the packages,
# without a release.

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The platforms with a GitHub runner, where the addons are tested natively
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform is built, so a manual run reports all the failures
      fail-fast: false
      matrix:
        # platform must match the name computed by prebuilt.js, which is the
        # folder of its package in npm/. An explicit Zig target builds for the
        # baseline CPU of the architecture instead of the CPU of the runner,
        # and on Linux for glibc 2.28 instead of the glibc of the runner, so the
        # addons also run on older systems.
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-linux-gnu.2.28
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-gnu.2.28
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-macos
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-macos
          - os: windows-latest
            platform: win32-x64
            target: x86_64-windows
          - os: windows-11-arm
            platform: win32-arm64
            target: aarch64-windows
          # Built with the x64 Node.js and Zig of the runner, and tested with
          # Node.js 22, the last version with binaries for Windows x86
          - os: windows-latest
            platform: win32-ia32
            target: x86-windows
            npm-platform: --cpu=ia32
            test-node: 22
            test-arch: x86
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        # The release publishes the version of package.json
        run: test "$TAG" = "$(node -p "require('./package.json').version")"
      # Installs the libgs package of the platform built: the one of the runner
      # or, with npm-platform, the one of the os, cpu and libc it sets. npm does
      # not install a package of optionalDependencies afterwards, with --force.
      - run: npm install --ignore-scripts ${{ matrix.npm-platform }}
      - name: Build
        if: runner.os != 'Windows'
        run: npx marmotta build --target ${{ matrix.target }}
      # Git Bash puts its GNU tar first on PATH, which reads C:\... as a remote
      # host: Marmotta runs in PowerShell to extract Zig with the tar of Windows
      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx marmotta build --target ${{ matrix.target }}

      - uses: actions/setup-node@v7
        if: matrix.test-node
        with:
          node-version: ${{ matrix.test-node }}
          architecture: ${{ matrix.test-arch }}
      - run: npm test

      # On Linux and macOS the addon contains Ghostscript. On Windows it loads
      # the DLL of libgs from its own folder, so the DLL, which the build copies
      # next to the addon, is in the package too.
      - name: Package
        run: |
          shopt -s nullglob
          cp build/Release/ghostscript4js.node build/Release/*.dll npm/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            npm/${{ matrix.platform }}/ghostscript4js.node
            npm/${{ matrix.platform }}/*.dll
          if-no-files-found: error

  # The musl addons are built in Alpine Linux containers
  build-musl:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64-musl
            target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "$(node -p "require('./package.json').version")"
      # npm runs scripts as the owner of the project folder, so the build runs
      # in a copy owned by the root user of the container. npm installs the
      # musl libgs package of the container.
      - name: Build and test
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm -v "$PWD:/src" -e TARGET -e PLATFORM node:24-alpine sh -euc '
            apk add --no-cache tar xz
            cp -r /src /build
            cd /build
            npm install --ignore-scripts
            npx marmotta build --target "$TARGET"
            npm test
            cp build/Release/ghostscript4js.node "/src/npm/$PLATFORM/"'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: npm/${{ matrix.platform }}/ghostscript4js.node
          if-no-files-found: error

  # The platforms without a GitHub runner are cross-compiled with Zig, with the
  # targets and the glibc versions of the libgs libraries, and tested with QEMU
  # in a container, or in a virtual machine on FreeBSD
  build-cross:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # machine is the architecture of the addon printed by readelf. The
        # Debian images get the Node.js of Debian, which is version 20.
        include:
          - platform: linux-ia32
            target: x86-linux-gnu.2.17
            npm-platform: --os=linux --cpu=ia32 --libc=glibc
            machine: Intel 80386
            docker-platform: linux/386
            image: debian:trixie-slim
          # Zig has a single arm architecture, so the version of the libgs
          # library, which also sets the CPU, is chosen with GS4JS_ARM_VERSION.
          # Debian has no armv6 port, but its armv7 one runs armv6 code.
          - platform: linux-armv6
            target: arm-linux-gnueabihf.2.28
            arm-version: 6
            npm-platform: --os=linux --cpu=arm --libc=glibc
            machine: ARM
            docker-platform: linux/arm/v7
            image: debian:trixie-slim
          - platform: linux-armv7
            target: arm-linux-gnueabihf.2.28
            arm-version: 7
            npm-platform: --os=linux --cpu=arm --libc=glibc
            machine: ARM
            docker-platform: linux/arm/v7
            image: debian:trixie-slim
          - platform: linux-ppc64
            target: powerpc64le-linux-gnu.2.28
            npm-platform: --os=linux --cpu=ppc64 --libc=glibc
            machine: PowerPC64
            docker-platform: linux/ppc64le
            image: node:24-trixie-slim
          - platform: linux-s390x
            target: s390x-linux-gnu.2.28
            npm-platform: --os=linux --cpu=s390x --libc=glibc
            machine: IBM S/390
            docker-platform: linux/s390x
            image: node:24-trixie-slim
          - platform: linux-riscv64
            target: riscv64-linux-gnu.2.28
            npm-platform: --os=linux --cpu=riscv64 --libc=glibc
            machine: RISC-V
            docker-platform: linux/riscv64
            image: debian:trixie-slim
          # There is no official loong64 image to run the tests
          - platform: linux-loong64
            target: loongarch64-linux-gnu.2.36
            npm-platform: --os=linux --cpu=loong64 --libc=glibc
            machine: LoongArch
          - platform: linux-armv6-musl
            target: arm-linux-musleabihf
            arm-version: 6
            npm-platform: --os=linux --cpu=arm --libc=musl
            machine: ARM
            docker-platform: linux/arm/v6
            image: node:22-alpine
          - platform: linux-armv7-musl
            target: arm-linux-musleabihf
            arm-version: 7
            npm-platform: --os=linux --cpu=arm --libc=musl
            machine: ARM
            docker-platform: linux/arm/v7
            image: node:22-alpine
          - platform: freebsd-x64
            target: x86_64-freebsd
            npm-platform: --os=freebsd --cpu=x64
            machine: Advanced Micro Devices X86-64
            vm: freebsd
    env:
      GS4JS_ARM_VERSION: ${{ matrix.arm-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "$(node -p "require('./package.json').version")"
      # Installs the libgs package of the target, as in the build job
      - run: npm install --ignore-scripts ${{ matrix.npm-platform }}
      - name: Build
        run: npx marmotta build --target ${{ matrix.target }}
      - name: Check the architecture
        run: |
          readelf -h build/Release/ghostscript4js.node
          test "$(readelf -h build/Release/ghostscript4js.node | sed -n 's/^ *Machine: *//p')" = "${{ matrix.machine }}"

      # Only the test dependencies are needed, and the libgs packages are large
      - run: rm -rf node_modules/@libgs
      - name: Set up QEMU
        if: matrix.image
        uses: docker/setup-qemu-action@v4
      - name: Test on ${{ matrix.image }} (${{ matrix.docker-platform }})
        if: matrix.image
        run: |
          docker run --rm --platform ${{ matrix.docker-platform }} -v "$PWD:/src" -w /src ${{ matrix.image }} sh -euc '
            command -v node > /dev/null || {
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs > /dev/null
            }
            uname -m
            node --version
            node node_modules/jasmine/bin/jasmine.js JASMINE_CONFIG_PATH=test/jasmine.json'
      - name: Test on FreeBSD
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: pkg install -y node22
          run: |
            uname -a
            node --version
            node node_modules/jasmine/bin/jasmine.js JASMINE_CONFIG_PATH=test/jasmine.json

      - name: Package
        run: cp build/Release/ghostscript4js.node npm/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: npm/${{ matrix.platform }}/ghostscript4js.node
          if-no-files-found: error

  # Publishes the packages of the platforms and then ghostscript4js, so its
  # optional dependencies can be installed as soon as it is published. They are
  # published with the next tag: the latest tag is moved to them by the promote
  # job, after the verify job has installed them on each platform. A package
  # that is already published is skipped, so the job can be run again after a
  # failure. A manual run only packs the packages, to show their content.
  publish:
    name: Publish to npm
    needs:
      - build
      - build-musl
      - build-cross
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs the provenance of the packages
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Each artifact is named after its platform, so it is extracted to the
      # folder of the package of the platform
      - uses: actions/download-artifact@v8
        with:
          path: npm
      # npm publishes a package even when the files listed in its package.json are missing
      - name: Check the packages
        run: |
          node npm/version.js --check
          for dir in ./npm/*/; do
            for file in $(node -p "require('${dir}package.json').files.join(' ')"); do
              test -f "$dir$file" || { echo "::error::$dir$file is missing"; exit 1; }
            done
          done
      - name: Pack
        if: github.event_name != 'release'
        run: |
          for dir in ./npm/*/; do
            npm pack --dry-run "$dir"
          done
          npm pack --dry-run
      - name: Publish
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          publish() {
            name=$(node -p "require('$1/package.json').name")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$1" --tag next --access public --provenance
            fi
          }
          for dir in ./npm/*/; do
            publish "$dir"
          done
          publish .
          # The verify job installs the packages as soon as this job ends
          for i in $(seq 30); do
            npm view "ghostscript4js@$version" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::ghostscript4js@$version is not available on npm"
          exit 1

  # Installs the published package from npm as a user would, with the oldest
  # supported Node.js version and without Ghostscript on the system. The build
  # from source is disabled by pointing Marmotta to a Zig installation that
  # does not exist, so the installation fails unless npm installs the package
  # of the platform and its addon is loaded. npm 12 and later do not run the
  # install script of ghostscript4js, which is not allowed, so the addon is
  # loaded without it. linux-armv6 is not checked, because the Node.js of the
  # armv7 containers that run it loads the armv7 addon, and linux-loong64 has
  # no container.
  verify:
    name: Install on ${{ matrix.platform }}
    needs: publish
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is tested in containers, without the libraries of the runner.
        # The Debian images get Node.js 20 and npm from Debian.
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            image: node:20-bookworm
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            image: node:20-bookworm
          - os: ubuntu-24.04
            platform: linux-ia32
            image: debian:trixie-slim
            docker-platform: linux/386
          - os: ubuntu-24.04
            platform: linux-armv7
            image: node:20-bookworm
            docker-platform: linux/arm/v7
          - os: ubuntu-24.04
            platform: linux-ppc64
            image: node:20-bookworm
            docker-platform: linux/ppc64le
          - os: ubuntu-24.04
            platform: linux-s390x
            image: node:20-bookworm
            docker-platform: linux/s390x
          - os: ubuntu-24.04
            platform: linux-riscv64
            image: debian:trixie-slim
            docker-platform: linux/riscv64
          - os: ubuntu-24.04
            platform: linux-x64-musl
            image: node:20-alpine
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            image: node:20-alpine
          - os: ubuntu-24.04
            platform: linux-armv6-musl
            image: node:20-alpine
            docker-platform: linux/arm/v6
          - os: ubuntu-24.04
            platform: linux-armv7-musl
            image: node:20-alpine
            docker-platform: linux/arm/v7
          - os: ubuntu-24.04
            platform: freebsd-x64
            vm: freebsd
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
          - os: windows-latest
            platform: win32-ia32
            node: 22
            node-arch: x86
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.event.release.tag_name }}
      SMOKE_TEST: |
        const gs = require('ghostscript4js')
        console.log(gs.version())
        gs.executeSync('-q -dNODISPLAY -dNOPAUSE -dBATCH -c quit')
      # Installs the version $1 of the package in the current folder, with
      # sh -euc "$INSTALL" sh <version>
      INSTALL: |
        npm init --yes > /dev/null
        npm install --foreground-scripts "ghostscript4js@$1"
        node -e "$SMOKE_TEST"
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node || 20 }}
          architecture: ${{ matrix.node-arch }}

      - name: Set up QEMU
        if: matrix.docker-platform
        uses: docker/setup-qemu-action@v4
      - name: Install in ${{ matrix.image }}
        if: matrix.image
        env:
          DOCKER_PLATFORM: ${{ matrix.docker-platform }}
        run: |
          docker run --rm ${DOCKER_PLATFORM:+--platform "$DOCKER_PLATFORM"} -e VERSION -e SMOKE_TEST -e INSTALL -e MARMOTTA_ZIG_DIR=/no-zig ${{ matrix.image }} sh -euc '
            command -v npm > /dev/null || {
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs npm > /dev/null
            }
            mkdir /app
            cd /app
            sh -euc "$INSTALL" sh "$VERSION"'

      - name: Install on FreeBSD
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          envs: VERSION SMOKE_TEST INSTALL
          prepare: pkg install -y node22 npm-node22
          run: |
            export MARMOTTA_ZIG_DIR=/no-zig
            mkdir /tmp/app
            cd /tmp/app
            sh -euc "$INSTALL" sh "$VERSION"

      - name: Install
        if: runner.os != 'Linux'
        env:
          MARMOTTA_ZIG_DIR: ${{ runner.temp }}/no-zig
        run: |
          mkdir app
          cd app
          sh -euc "$INSTALL" sh "$VERSION"

  # Moves the latest tag to the packages installed on every platform
  promote:
    name: Tag the packages as latest
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          for dir in ./npm/*/; do
            npm dist-tag add "$(node -p "require('${dir}package.json').name")@$version" latest
          done
          npm dist-tag add "ghostscript4js@$version" latest
