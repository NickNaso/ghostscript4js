name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    env:
      ARCHIVE: ghostscript4js-${{ github.event.release.tag_name }}-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-ghostscript
      # The install script builds the addon with marmotta
      - run: npm install
      - run: npm test

      # Only the addon is packaged: the Ghostscript library is not redistributed
      - name: Package
        if: runner.os != 'Windows'
        run: zip -j "$ARCHIVE" build/Release/ghostscript4js.node LICENSE
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Release/ghostscript4js.node, LICENSE -DestinationPath $env:ARCHIVE

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  upload:
    name: Attach archives to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: find dist -name '*.zip' -exec gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber {} +
